name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node rendering dependencies
        run: npm ci --ignore-scripts
      - name: Check Live2D renderer syntax
        run: node --check live2d/render.mjs
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Test persona loading
        run: node --test tests/persona.test.mjs
      - name: Check host module syntax
        run: node --check index.js
      - name: Verify package inventory
        run: npm pack --dry-run --json
